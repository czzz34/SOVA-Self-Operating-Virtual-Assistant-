<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOVA Web Control</title>
  <style>
    /* Global Styles */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #2c2c2c;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      padding: 20px;
      max-width: 600px;
      width: 90%;
    }
    h1 {
      text-align: center;
      color: #f39c12;
    }
    /* Textarea for output */
    #output {
      width: 100%;
      height: 300px;
      background: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px;
      resize: none;
      font-size: 14px;
      margin-bottom: 15px;
    }
    /* Command Input */
    #commandInput {
      width: calc(100% - 120px);
      padding: 10px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #1e1e1e;
      color: #e0e0e0;
      font-size: 14px;
      margin-right: 10px;
    }
    /* Buttons */
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      background: #f39c12;
      color: #1e1e1e;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-bottom: 10px;
    }
    button:hover {
      background: #e08e0b;
    }
    /* Input container */
    .input-container {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    /* Footer styling */
    footer {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SOVA Web Control</h1>
    <textarea id="output" readonly placeholder="SOVA responses will appear here..."></textarea>
    <div class="input-container">
      <input type="text" id="commandInput" placeholder="Enter your command here">
      <button id="sendBtn">Send</button>
    </div>
    <button id="voiceBtn">Voice Input</button>
    <footer>Control SOVA from anywhere on your local network</footer>
  </div>
  
  <script>
    function sendCommand(command) {
      fetch('/send', {  // Changed endpoint from /web_input to /send
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: command })
      })
      .then(response => response.json())
      .then(data => {
        let output = document.getElementById('output');
        output.value += "You: " + command + "\n";
        output.value += "Command sent to SOVA.\n\n";
        document.getElementById('commandInput').value = "";
      })
      .catch(err => console.error("SOVA encountered a communication error:", err));
    }
    
    document.getElementById('sendBtn').addEventListener('click', () => {
      let command = document.getElementById('commandInput').value;
      if (command) {
        sendCommand(command);
      }
    });
    
    document.getElementById('commandInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        let command = document.getElementById('commandInput').value;
        if (command) {
          sendCommand(command);
        }
      }
    });
    
    // Voice input using the Web Speech API
    document.getElementById('voiceBtn').addEventListener('click', () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Your browser does not support speech recognition.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('commandInput').value = transcript;
        sendCommand(transcript);
      };
      recognition.onerror = function(event) {
        alert("Voice recognition error: " + event.error);
      };
      recognition.start();
    });
  </script>
</body>
</html>
